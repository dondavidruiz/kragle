#controls{position:fixed;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 20px);padding:8px 10px;display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;background:#091623f2;border:1px solid #316078;border-radius:12px;box-shadow:0 4px 30px #0008;transition:opacity .2s}#controls.hidden{display:none}#controls button,#openControls{border:1px solid #3c6579;border-radius:6px;padding:9px 12px;background:#122b3c;color:#e1eff7;font-size:13px;font-weight:700;white-space:nowrap}#controls button:hover,#openControls:hover{background:#21445b}#controls button.primary{background:#ffcf48;color:#101925;border-color:#ffcf48}#controls button.win{background:#134534;color:#9af8c8;border-color:#39886c}#controls button:disabled{opacity:.4;cursor:default}#openControls{position:fixed;bottom:10px;right:10px;z-index:10;opacity:.85}#openControls[hidden]{display:none}#hint{font-size:11px;color:#91a7b8;padding:0 5px}dialog{max-width:calc(100vw - 32px);width:420px;color:#e0eff7;background:#0e2131;border:1px solid #3e839c;border-radius:16px;padding:24px;box-shadow:0 10px 80px #000b}dialog::backdrop{background:#020813bb}dialog h2{margin:0 0 12px;font-size:22px}dialog p{line-height:1.5;color:#b8d3e0}dialog .actions{display:flex;justify-content:flex-end;gap:10px}dialog button{padding:10px 16px;border:1px solid #3c6579;background:#15374b;color:#fff;border-radius:8px}dialog button.confirm{background:#ffcf48;border-color:#ffcf48;color:#0d1725;font-weight:bold}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.confetti{display:none}}@media(max-width:650px){#controls{gap:4px;padding:5px}#controls button{font-size:11px;padding:7px 8px}#hint{display:none}}

</style></head><body><main id="viewport"><section id="stage" aria-label="Centro de mando de la Resistencia"><div class="border"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><header class="header"><div class="eyebrow">TRANSMISIÓN DE LA RESISTENCIA</div><div class="op">OPERACIÓN</div><div class="kragle">KRAGLE 2.0</div></header><div class="side left" aria-hidden="true">ESTADO / 01<div id="metersL"></div></div><div class="side right" aria-hidden="true">ESTADO / 02<div id="metersR"></div></div><div class="clock"><div class="clock-label" id="clockLabel">TIEMPO DISPONIBLE</div><svg id="digits" viewBox="0 0 440 148" role="img" aria-label="45 minutos y 0 segundos"></svg></div><div id="status" role="status">¡QUE COMIENCE LA OPERACIÓN!</div><div class="stats"><div class="stat">9 HÉROES</div><div class="stat">8 MISIONES</div><div class="stat">2 CAJAS</div><div class="stat">1 OPORTUNIDAD</div></div><div class="line"></div><div class="slogan" id="slogan">¡SALVAD EL CUMPLEAÑOS DE ABRIL!</div><div class="stage-alert"></div><div class="confetti" id="confetti" aria-hidden="true"></div></section></main>
<nav id="controls" aria-label="Controles de organización"><button class="primary" id="start">Iniciar 45:00</button><button id="pause" disabled>Pausa</button><button id="phase">Fase 2</button><button id="extra">+1 min</button><button class="win" id="win">Desactivar KRAGLE</button><button id="sound">Sonido: sí</button><button id="full">Pantalla completa</button><button id="reset">Reiniciar</button><button id="hide">Ocultar</button><span id="hint">H: controles</span></nav><button id="openControls" hidden>Controles · H</button><dialog id="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="actions"><button id="cancel">Cancelar</button><button class="confirm" id="confirm">Confirmar</button></div></dialog>
<script>
'use strict';const $=id=>document.getElementById(id);const initial=45*60*1000;let remaining=initial,deadline=0,state='ready',phase=1,sound=true,previous=2700,alertText='',alertUntil=0,lastDisplayed=-1,ctx=null,confirmation=null;const thresholds=[1800,900,300,60];const messages={1800:'¡QUEDAN 30 MINUTOS, AGENTES!',900:'¡QUEDAN 15 MINUTOS! ¡SEGUID ADELANTE!',300:'¡ALERTA! SOLO QUEDAN 5 MINUTOS',60:'¡ÚLTIMO MINUTO! ¡TODOS JUNTOS!'};const ns='http://www.w3.org/2000/svg';const shapes=[[10,0,60,12],[70,12,12,55],[70,78,12,55],[10,133,60,12],[0,78,12,55],[0,12,12,55],[10,66,60,12]];const lookup=['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];const digitGroups=[];
function rect(x,y,w,h,rx=3){const r=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x,y,width:w,height:h,rx}))r.setAttribute(k,v);return r}for(const x of [5,103,251,349]){const g=document.createElementNS(ns,'g');g.setAttribute('transform',`translate(${x} 1)`);const rs=shapes.map(a=>rect(...a));rs.forEach(r=>g.appendChild(r));$('digits').appendChild(g);digitGroups.push(rs)}for(const y of [40,96]){const r=rect(203,y,17,17,4);r.setAttribute('class','colon');$('digits').appendChild(r)}
for(const [id,arr] of [['metersL',[18,58,93,43,21,77]],['metersR',[33,89,69,18,51,94]]])arr.forEach((w,i)=>{const el=document.createElement('div');el.className='meter';const b=document.createElement('b');b.style.setProperty('--w',w+'%');b.style.setProperty('--d',(-i*.8)+'s');el.appendChild(b);$(id).appendChild(el)});
function fit(){const v=window.visualViewport;const z=Math.min((v?v.width:innerWidth)/1280,(v?v.height:innerHeight)/720);$('stage').style.transform=`scale(${z})`}addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);fit();
function audioReady(){if(!sound)return;try{ctx ||= new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume().catch(()=>{})}catch{}}function tone(freq,delay=.0,duration=.15,vol=.12,type='sine'){if(!sound||!ctx||ctx.state!=='running')return;const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.03)}function cue(kind){if(kind==='start'){[440,550,660,880].forEach((f,i)=>tone(f,i*.13,.21,.10));}else if(kind==='alert'){[550,440,550].forEach((f,i)=>tone(f,i*.24,.18,.13,'triangle'));}else if(kind==='tick'){tone(720,0,.12,.09,'triangle')}else if(kind==='end'){[440,330,220].forEach((f,i)=>tone(f,i*.34,.4,.15,'triangle'))}else if(kind==='win'){[523.25,659.25,783.99,1046.5,783.99,1046.5].forEach((f,i)=>tone(f,i*.18,.43,.13,'triangle'));[523.25,659.25,783.99,1046.5].forEach(f=>tone(f,1.14,1.2,.065))}}
function current(){return state==='running'?Math.max(0,deadline-Date.now()):remaining}function draw(sec){if(sec===lastDisplayed)return;lastDisplayed=sec;const m=Math.floor(sec/60),s=sec%60;const a=String(m).padStart(2,'0')+String(s).padStart(2,'0');digitGroups.forEach((rs,i)=>rs.forEach((r,j)=>r.setAttribute('class',lookup[Number(a[i])].includes('abcdefg'[j])?'seg-on':'seg-off')));$('digits').setAttribute('aria-label',`${m} minutos y ${s} segundos`);document.title=`${a.slice(0,2)}:${a.slice(2)} · KRAGLE 2.0`}
function note(text,ms=5000){alertText=text;alertUntil=Date.now()+ms}function tick(){let sec=Math.ceil(current()/1000);if(state==='running'){for(const n of thresholds)if(previous>n&&sec<=n&&sec>0){note(messages[n]);cue('alert')}if(sec!==previous&&sec<=10&&sec>0)cue('tick');previous=sec;if(sec===0){state='expired';remaining=0;releaseAwake();cue('end');buttons()}}draw(sec);$('stage').className=state+(state==='running'&&sec<=60?' urgent':'');$('clockLabel').textContent=state==='victory'?'TIEMPO RESTANTE AL DESACTIVAR':state==='paused'?'CUENTA ATRÁS EN PAUSA':state==='expired'?'TIEMPO AGOTADO':'TIEMPO DISPONIBLE';$('status').textContent=state==='victory'?'¡KRAGLE 2.0 DESACTIVADO!':state==='expired'?'TIEMPO AGOTADO · ESPERANDO A LA RESISTENCIA':state==='paused'?'OPERACIÓN EN PAUSA':state==='ready'?'¡QUE COMIENCE LA OPERACIÓN!':sec<=10?'¡ÚLTIMOS SEGUNDOS!':Date.now()<alertUntil?alertText:`FASE ${phase} / 2 · AMENAZA ACTIVADA`; $('slogan').textContent=state==='victory'?'¡HABÉIS SALVADO EL CUMPLEAÑOS DE ABRIL!':'¡SALVAD EL CUMPLEAÑOS DE ABRIL!'}
function buttons(){saveState();$('start').textContent=state==='paused'?'Reanudar':state==='ready'?'Iniciar 45:00':'En marcha';$('start').disabled=!['ready','paused'].includes(state);$('pause').disabled=state!=='running';$('extra').disabled=!['running','paused'].includes(state);$('phase').textContent=phase===1?'Fase 2':'Fase 1';$('phase').disabled=!['running','paused'].includes(state);$('win').disabled=!['running','paused','expired'].includes(state);$('sound').textContent='Sonido: '+(sound?'sí':'no')}
function start(){if(!['ready','paused'].includes(state))return;audioReady();const fresh=state==='ready';deadline=Date.now()+remaining;previous=Math.ceil(remaining/1000);state='running';keepAwake();if(fresh){cue('start');note('¡AGENTES, COMIENZA LA OPERACIÓN!',4500)}buttons();tick()}
function pause(){if(state!=='running')return;remaining=current();state='paused';releaseAwake();buttons();tick()}
function reset(){releaseAwake();state='ready';remaining=initial;deadline=0;phase=1;previous=2700;alertUntil=0;$('confetti').replaceChildren();buttons();tick()}
function win(){if(!['running','paused','expired'].includes(state))return;remaining=current();state='victory';releaseAwake();audioReady();cue('win');$('confetti').replaceChildren();for(let i=0;i<78;i++){const e=document.createElement('i');e.style.setProperty('--x',(Math.random()*100)+'%');e.style.setProperty('--c',['#ffcf48','#55f2a2','#37d0ec','#ffffff'][i%4]);e.style.setProperty('--t',(2+Math.random()*3)+'s');e.style.setProperty('--delay',Math.random()*1.4+'s');e.style.setProperty('--drift',(Math.random()*260-130)+'px');$('confetti').appendChild(e)}buttons();tick()}
function ask(title,text,fn){if($('modal').open)return;confirmation=fn;$('modalTitle').textContent=title;$('modalText').textContent=text;if(typeof $('modal').showModal==='function'){$('modal').showModal();$('cancel').focus()}else{confirmation=null;if(window.confirm(title+'\n'+text))fn()}}$('cancel').onclick=()=>{$('modal').close();confirmation=null};$('confirm').onclick=()=>{const fn=confirmation;confirmation=null;$('modal').close();if(fn)fn()};$('modal').addEventListener('cancel',()=>{confirmation=null});
function toggleControls(){const hidden=$('controls').classList.toggle('hidden');$('openControls').hidden=!hidden;saveState()}async function full(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{showInstallHelp()}}catch{showInstallHelp()}}document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'Salir pantalla completa':'Pantalla completa';fit()});
$('start').onclick=start;$('pause').onclick=pause;$('phase').onclick=()=>{phase=phase===1?2:1;note(`¡FASE ${phase} ACTIVADA!`);audioReady();cue('start');buttons();tick()};$('extra').onclick=()=>{if(!['running','paused'].includes(state))return;const add=Math.min(60000,Math.max(0,5999000-current()));if(state==='running')deadline+=add;else remaining+=add;previous=Math.ceil(current()/1000);buttons();tick()};$('win').onclick=()=>ask('¿Desactivar KRAGLE 2.0?','Confirma que los agentes han completado la misión. La cuenta atrás se detendrá y comenzará la celebración.',win);$('reset').onclick=()=>ask('¿Reiniciar la operación?','El contador volverá a 45:00 y se perderá el tiempo transcurrido.',reset);$('sound').onclick=()=>{sound=!sound;if(sound){audioReady();tone(660,0,.17)}buttons()};$('full').onclick=full;$('hide').onclick=toggleControls;$('openControls').onclick=toggleControls;
document.addEventListener('keydown',e=>{if(e.repeat||$('modal').open||e.altKey||e.ctrlKey||e.metaKey)return;const k=e.key.toLowerCase();if(k===' '&&!['BUTTON','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();state==='running'?pause():start()}else if(k==='h'){e.preventDefault();toggleControls()}else if(k==='f'){e.preventDefault();full()}else if(k==='m'){$('sound').click()}else if(k==='v'&&!$('win').disabled){$('win').click()}else if(k==='r'){$('reset').click()}});const storageKey='kragle-pwa-v1';let wakeLock=null,wakePending=false;
function saveState(){try{localStorage.setItem(storageKey,JSON.stringify({state,remaining:current(),deadline,phase,sound,hidden:$('controls').classList.contains('hidden')}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(storageKey)||'null');if(!d||!['ready','running','paused','victory','expired'].includes(d.state)||!Number.isFinite(d.remaining)||!Number.isFinite(d.deadline))return;state=d.state;remaining=Math.max(0,Math.min(5999000,d.remaining));deadline=d.deadline;phase=d.phase===2?2:1;sound=d.sound!==false;previous=Math.ceil(current()/1000);if(state==='running'&&current()<=0){state='expired';remaining=0}if(d.hidden){$('controls').classList.add('hidden');$('openControls').hidden=false}}catch(e){}}
async function keepAwake(){if(state!=='running'||document.visibilityState!=='visible'||!navigator.wakeLock||wakeLock||wakePending)return;wakePending=true;try{const lock=await navigator.wakeLock.request('screen');if(state!=='running'){await lock.release();return}wakeLock=lock;lock.addEventListener('release',()=>{if(wakeLock===lock)wakeLock=null})}catch(e){}finally{wakePending=false}}
function releaseAwake(){if(wakeLock){const lock=wakeLock;wakeLock=null;lock.release().catch(()=>{})}}
function showInstallHelp(){alert('En iPad: abre Safari, pulsa Compartir y Añadir a pantalla de inicio. Abre KRAGLE desde su icono para jugar sin las barras del navegador.')}
addEventListener('pagehide',saveState);document.addEventListener('visibilitychange',()=>{saveState();if(!document.hidden){tick();keepAwake()}});document.addEventListener('pointerdown',()=>{if(state==='running'){audioReady();keepAwake()}},{passive:true});
restore();buttons();tick();keepAwake();setInterval(tick,100);
if('serviceWorker' in navigator&&window.isSecureContext){navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Modo sin conexión no disponible',e))}
</script></body></html>
